<!doctype html>
<!-- Headless verification driver — a PERMANENT dev tool. It never deploys:
     build_site.py copies an explicit whitelist and this is not on it.
     All modes POST results to build/verify_server.py on :8901.
       ?shots=name,lon,lat,age[,zoom];...   screenshot set via APP.lookAt/shoot
       ?timing=NAME                         frame-time p50 at 2560x1440 -> NAME.json.png
       ?storm=NAME                          keyframe-crossing upload storm -> NAME.json.png
       ?playtest=NAME&speed=10&secs=8&sheetdelay=600   playback on the sheet path -> NAME.json.png
       ?pin=1                               freeze time (uTime + dt) for exact A/B
       ?oldnoise=1                          passed through to the app iframe
       ?layers=1                            turn hotspot/vector/boundary layers on -->
<meta charset="utf-8">
<title>verify driver</title>
<iframe id="app" style="width:1280px;height:960px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
// Every key the driver does not consume is forwarded to the app verbatim, so
// a knob sweep (?atlasN= ?basin=0 ?noatlas=1 ?erg=0 ...) runs through the
// same harness as a plain shot. The driver's own keys stay here.
const DRIVER_KEYS = new Set(['shots','timing','storm','pin','layers','soak','mins','scrub','coherence','secs','playtest','sheetdelay',
                             'evalq','expr','age','lon','lat','zoom','w','h','wait','rivdbg','rivage','bake','sheet',
                             'app','settle','shotsize','nolabels','quick',
                             // the port round (2026-09-07): matched old/new baselines
                             'clouds','weather','view','seek','targets','fielddelay','gtilt','head','mem','compile','weathertest','dwell','smoke','playsmooth','speed','quality','playing']);
const passthrough = [...q.entries()].filter(([k]) => !DRIVER_KEYS.has(k)).map(([k, v]) => '&' + k + '=' + encodeURIComponent(v)).join('');
// ?app=_lace1.html points the driver at a variant build (bisection probes);
// default is the real app. Variants never deploy: build_site copies a whitelist.
// ?bake= loads the app in its own sheet-baking configuration: lite path on, shipped
// sheets ignored, whole-sheet strips, and the requested width.
const bakeArgs = q.get('bake') ? '&lite=1&noshipped=1&bakefull=1&sheet=' + (q.get('sheet') || 4096) : '';
document.getElementById('app').src = (q.get('app') || 'index.html') + '?run=verify&cb=' + Date.now() + passthrough + bakeArgs;
const shots = (q.get('shots') || '').split(';').filter(Boolean).map(s => {
  const [name, lon, lat, age, zoom, gtilt, head] = s.split(',');
  return {name, lon: +lon, lat: +lat, age: +age, zoom: zoom ? +zoom : null,
          gtilt: gtilt ? +gtilt : null, head: head ? +head : null};
});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => document.getElementById('app').contentWindow;
(async () => {
  let t0 = Date.now();
  while (!(W() && W().APP) && Date.now() - t0 < 60000) await sleep(300);
  if (!(W() && W().APP)) { document.title = 'VERIFY-FAIL-BOOT'; return; }
  const A = W().APP;
  if (q.get('pin')) {
    // Freeze the clock that reaches loop(): uTime, cloud drift and the sea
    // sheen become deterministic, so two runs differ only by code under test.
    W().performance.now = () => 777000;
    const orf = W().requestAnimationFrame.bind(W());
    W().requestAnimationFrame = cb => orf(() => cb(777000));
  }
  if (q.get('layers')) {
    // '1' keeps the old everything-on behavior; a comma list enables only
    // the named layers -- the iteration-23 control needs boundaries ALONE.
    const lv = q.get('layers');
    if (lv === '1') { A.state.layers.hotspots = true; A.state.layers.vectors = true; A.state.layers.boundaries = true; }
    else for (const k of lv.split(',')) if (k in A.state.layers) A.state.layers[k] = true;
  }

  /* ---- THE PORT ROUND (2026-09-07): matched old-vs-new baselines ----
     ?clouds=0 hides the cloud layer (the frozen old page has no toggle, so
     its cloud MATERIAL is switched off; the new page uses its layer switch),
     ?weather=0 freezes the weather clock, ?view=map takes the flat map,
     ?fielddelay=ms delays every field fetch (a CDN round trip from
     localhost, as ?sheetdelay does for sheets). shown() reports which
     elevation pair is actually on screen against the pair the age asks for,
     on either page: the new app exposes APP.surface(); the old one is read
     from its uniforms. */
  if (q.get('clouds') === '0') {
    if (A.state.layers && 'clouds' in A.state.layers) A.state.layers.clouds = false;
    else if (A.gl.clouds) A.gl.clouds.material.visible = false;
  }
  if (q.get('weather') === '0' && A.state.layers && 'weather' in A.state.layers) A.state.layers.weather = false;
  if (q.get('fielddelay')) {
    const of = W().fetch.bind(W()), d = +q.get('fielddelay');
    W().fetch = (u, o) => String(u).includes('fields/') ? sleep(d).then(() => of(u, o)) : of(u, o);
  }
  if (q.get('view') === 'map') {
    const b = W().document.querySelector('#viewSeg button[data-v="map"]'); if (b) b.click();
  }
  if (q.get('quality')) { A.state.quality = q.get('quality'); W().eval('applyQuality()'); }   // pin a render quality (perf engages the sheets eagerly)
  const shown = () => {
    if (A.surface) return A.surface();
    const f = A.curFrame(), u = A.gl.mat.uniforms;
    let si = -1, sj = -1;
    for (const [k, v] of A.TEXCACHE) {
      if (k.charCodeAt(0) !== 101 || !v.t) continue;
      if (v.t === u.elevA.value) si = +k.slice(1);
      if (v.t === u.elevB.value) sj = +k.slice(1);
    }
    const full = si === f.i && sj === f.j;
    return {req: [f.i, f.j], shown: [si, sj], mode: full ? 'full' : 'stale', preview: false};
  };
  const resources = () => {
    let n = 0, b = 0;
    for (const e of W().performance.getEntriesByType('resource'))
      if (/fields\/|sheets\/|imagery\//.test(e.name)) { n++; b += e.transferSize || e.encodedBodySize || 0; }
    return {n, b};
  };

  if (q.get('seek')) {
    /* COLD SEEK TO DETAIL. From a settled age, set the age the way the slider
       does and watch what is on screen: the first moment the picture stops
       being the pre-seek world (a preview, a nearer still, or the pair
       itself), and the moment the exact requested pair is bound at full
       detail. Also the field requests and bytes each seek cost. */
    const targets = (q.get('targets') || '1000,0,300,-250,700').split(',').map(Number);
    await sleep(6000);
    for (let k = 0; k < 10; k++) { A.step(); await sleep(150); }
    const seeks = [];
    for (const age of targets) {
      const before = shown(), r0 = resources(), f0 = A.loader().frame;
      const t0 = performance.now();
      A.state.age = age;                       // the slider path: state first, the loop binds
      const want = A.curFrame();
      let first = -1, detail = -1, samples = 0, previewN = 0, staleN = 0, stillN = 0;
      while (performance.now() - t0 < 30000) {
        await sleep(20);
        const s = shown(); samples++;
        const same = s.shown[0] === before.shown[0] && s.shown[1] === before.shown[1] && !s.preview;
        if (s.preview) previewN++; else if (same) staleN++; else if (!(s.mode === 'full' && s.shown[0] === want.i && s.shown[1] === want.j)) stillN++;
        if (first < 0 && !same) first = performance.now() - t0;
        if (s.mode === 'full' && s.shown[0] === want.i && s.shown[1] === want.j) { detail = performance.now() - t0; break; }
      }
      const r1 = resources();
      seeks.push({age, firstMs: +first.toFixed(0), detailMs: +detail.toFixed(0), samples, previewSamples: previewN,
                  staleSamples: staleN, stillSamples: stillN, frames: A.loader().frame - f0,
                  requests: r1.n - r0.n, MB: +((r1.b - r0.b) / 1048576).toFixed(2), final: shown()});
      await sleep(+q.get('dwell') || 1500);
    }
    await fetch('http://127.0.0.1:8901/' + q.get('seek') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({readyAt: +(W().__readyAt || 0).toFixed(0),
                  fielddelay: +(q.get('fielddelay') || 0), seeks, errors: (W().__ERRORS || []).slice(0, 5)}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('mem')) {
    /* WORKING SET UNDER REPEATED TRAVERSAL. Jumps across the whole timeline
       every 3 s for ?secs=, sampling residency each half second; the report
       carries every sample and the peak of each pass, so monotonic growth
       shows as a rising pass peak. */
    const secs = +q.get('secs') || 90, jumps = [1000, 0, 300, -250, 700, 66, 540, -100];
    const samples = [], t1 = Date.now(); let j = 0, lastJump = 0;
    await sleep(5000);
    while (Date.now() - t1 < secs * 1000) {
      await sleep(500);
      const m = W().__MEM ? W().__MEM() : {};
      m.t = Math.round((Date.now() - t1) / 1000);
      m.glTex = A.gl.renderer.info.memory.textures;
      m.heapMB = W().performance.memory ? Math.round(W().performance.memory.usedJSHeapSize / 1048576) : null;
      m.pass = Math.floor(j / jumps.length);
      samples.push(m);
      if (Date.now() - lastJump > 3000) { A.state.age = jumps[j++ % jumps.length]; lastJump = Date.now(); }
    }
    const passes = [];
    for (const m of samples) { const p = passes[m.pass] || (passes[m.pass] = {pass: m.pass, cacheMB: 0, pinnedMB: 0, glTex: 0, extraMB: 0});
      p.cacheMB = Math.max(p.cacheMB, m.cacheMB || 0); p.pinnedMB = Math.max(p.pinnedMB, m.pinnedMB || 0);
      p.glTex = Math.max(p.glTex, m.glTex || 0); p.extraMB = Math.max(p.extraMB, m.extraMB || 0); }
    await fetch('http://127.0.0.1:8901/' + q.get('mem') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({secs, passes, errors: (W().__ERRORS || []).slice(0, 5), samples}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('compile')) {
    /* REAL COMPILE AND LINK on this machine's GPU: every material the app
       owns, including the ones no object carries at boot (the sheet path,
       the preview, the map cloud plane). Reports link status per program,
       the GL limits the build check encodes, and any page error. */
    const R = A.gl.renderer, gl = R.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const glr = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
    const mats = A.gl.materials || {terrain: A.gl.mat, clouds: A.gl.clouds && A.gl.clouds.material};
    const probes = [];
    for (const [name, m] of Object.entries(mats)) {
      if (!m) continue;
      const mesh = new (W().THREE.Mesh)(new (W().THREE.PlaneGeometry)(1, 1), m);
      mesh.name = 'probe_' + name; mesh.visible = false; A.gl.scene.add(mesh); probes.push(mesh);
    }
    let compileError = null;
    try { R.compile(A.gl.scene, A.gl.cam); } catch (e) { compileError = String(e && e.message || e); }
    await sleep(300);
    const programs = R.info.programs.map(p => ({name: p.name, linked: !!gl.getProgramParameter(p.program, gl.LINK_STATUS),
      usedTimes: p.usedTimes, diagnostics: p.diagnostics ? {runnable: p.diagnostics.runnable,
        vertexLog: String(p.diagnostics.vertexShader && p.diagnostics.vertexShader.log || '').slice(0, 600),
        fragmentLog: String(p.diagnostics.fragmentShader && p.diagnostics.fragmentShader.log || '').slice(0, 600)} : null}));
    for (const m of probes) A.gl.scene.remove(m);
    const out = {glr, three: W().THREE.REVISION, webgl2: !!R.capabilities.isWebGL2,
                 maxTextureUnits: gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS), maxTextureSize: gl.getParameter(gl.MAX_TEXTURE_SIZE),
                 materials: Object.keys(mats).filter(k => mats[k]), programs, compileError,
                 errors: (W().__ERRORS || []).slice(0, 10)};
    await fetch('http://127.0.0.1:8901/' + q.get('compile') + '.json',
                {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('smoke')) {
    /* THE ORIGINAL FEATURES, exercised (the port round): every control the
       page has, driven the way a hand would, with the state read back after
       each. A regression here is a control that stopped answering. */
    const D = W().document, S = A.state, r = {steps: []};
    const ok = (name, cond, extra) => r.steps.push({name, ok: !!cond, ...(extra ? {extra} : {})});
    const click = sel => { const el = D.querySelector(sel); if (!el) return false; el.click(); return true; };
    const slide = (sel, v) => { const el = D.querySelector(sel); el.value = v; el.dispatchEvent(new (W().Event)('input', {bubbles: true})); };
    await sleep(3000);
    A.jumpTo(300); for (let k = 0; k < 8; k++) { A.step(); await sleep(250); }
    ok('jumpTo 300', S.age === 300 && A.surface().req[0] === A.curFrame().i);
    for (const L of ['boundaries', 'vectors', 'hotspots']) { click('.tog[data-layer="' + L + '"]'); }
    for (let k = 0; k < 6; k++) { A.step(); await sleep(250); }
    const ov = W().eval('({b:overlay.boundaries.visible||overlay.derived.visible,bn:overlay.derived.children.length+overlay.boundaries.children.length,v:overlay.vectors.visible,vn:overlay.vectors.children.length,h:overlay.hotspots.visible,hn:overlay.hotspots.children.length})');
    ok('boundaries layer', S.layers.boundaries && ov.b && ov.bn > 0, ov);
    ok('vectors layer', S.layers.vectors && ov.v, ov);
    ok('hotspots layer', S.layers.hotspots && ov.h && ov.hn > 0, ov);
    for (const L of ['boundaries', 'vectors', 'hotspots']) click('.tog[data-layer="' + L + '"]');
    click('.tog[data-layer="labels"]'); A.step();
    ok('labels off', S.layers.labels === false && !D.querySelector('.plabel.show'));
    click('.tog[data-layer="labels"]'); A.step(); A.layoutLabels();
    ok('labels on', S.layers.labels === true && D.querySelectorAll('.plabel.show').length > 0, {shown: D.querySelectorAll('.plabel.show').length});
    const lab = (A.DATA.labels || []).find(l => A.labelVisible(l) && l.t === 'continent') || (A.DATA.labels || []).find(l => A.labelVisible(l));
    if (lab) { A.showFeature(lab); A.step(); }
    ok('feature card', lab && D.querySelector('#info').classList.contains('show') && D.querySelector('#infoName').textContent === lab.n, {name: lab && lab.n});
    click('#infoClose'); A.step();
    ok('card closes', !D.querySelector('#info').classList.contains('show'));
    A.selectAt(20, 10); A.step();
    ok('click on the surface opens a card', D.querySelector('#info').classList.contains('show'), {name: D.querySelector('#infoName').textContent});
    click('#infoClose');
    slide('#tiltR', 45); slide('#headR', 90); A.step();
    ok('tilt and heading', S.gtilt === 45 && S.head === 90);
    click('#resetNorth'); await sleep(900); A.step();
    ok('reset to north', S.gtilt === 0 && S.head === 0, {gtilt: S.gtilt, head: S.head});
    click('#viewSeg button[data-v="map"]'); A.step(); A.step();
    const lon0 = S.mapLon; click('#mapE'); A.step();
    ok('map view and pan east', S.view === 'map' && S.mapLon === lon0 + 30 && A.gl.mat.uniforms.uMapLon.value !== 0, {mapLon: S.mapLon});
    const ms = A.snap(200, 200); ok('map draws', !ms.error, ms.error || null);
    click('#viewSeg button[data-v="globe"]'); A.step();
    ok('globe view back', S.view === 'globe');
    const a0 = S.age; click('#stepFwd'); ok('step forward 1 Myr', S.age === a0 - 1); click('#stepBack'); ok('step back 1 Myr', S.age === a0);
    click('#playBtn'); A.step(); await sleep(400); A.step();
    ok('play advances time and keeps the clouds', S.playing && S.age < a0 && A.gl.clouds.visible, {age: S.age, clouds: A.gl.clouds.visible});
    click('#playBtn'); A.step();
    ok('pause', !S.playing);
    click('#dir'); ok('direction flips', S.dir === 1); click('#dir');
    slide('#speed', 7); ok('speed slider', S.speed === 7 && D.querySelector('#speedVal').textContent === '7 Myr/s'); slide('#speed', 3);
    click('#rotBtn'); ok('auto-rotate on', S.layers.rotate === true && !D.querySelector('#spinwrap').hidden); click('#rotBtn');
    const q0 = S.quality; click('#qualBtn'); ok('quality cycles', S.quality !== q0, {from: q0, to: S.quality}); while (S.quality !== q0) click('#qualBtn');
    click('#ambientBtn'); A.step();
    ok('ambient on', S.ambient && D.body.classList.contains('ambient') && S.playing);
    click('#exitAmbient'); A.step(); S.playing = false;
    ok('ambient off', !S.ambient && !D.body.classList.contains('ambient'));
    const sr = D.querySelector('#scalerow'), rect = D.querySelector('#track').getBoundingClientRect();
    sr.dispatchEvent(new (W().PointerEvent)('pointerdown', {bubbles: true, clientX: rect.left + rect.width * 0.5, clientY: 0, button: 0, pointerId: 7}));
    sr.dispatchEvent(new (W().PointerEvent)('pointerup', {bubbles: true, clientX: rect.left + rect.width * 0.5, clientY: 0, button: 0, pointerId: 7}));
    ok('era row seeks', Math.abs(S.age - 375) <= 2, {age: S.age});
    click('.tog[data-layer="clouds"]'); A.step();
    ok('cloud switch off', S.layers.clouds === false && !A.gl.clouds.visible);
    click('.tog[data-layer="clouds"]');
    click('.tog[data-layer="weather"]'); ok('weather switch off', S.layers.weather === false); click('.tog[data-layer="weather"]');
    const ch = D.querySelector('#gmstChart'), dot = D.querySelector('#gmstDot');
    A.jumpTo(0); A.step(); W().eval('updateReadout()');
    ok('graph marks the present at 80%', ch && !ch.hidden && Math.abs(+dot.getAttribute('cx') - 217.6) < 0.2 && D.querySelector('#gmstSel').textContent.includes('14.4'), {cx: dot && dot.getAttribute('cx'), sel: D.querySelector('#gmstSel').textContent});
    click('#aboutBtn'); ok('about panel', D.querySelector('#about').classList.contains('show')); click('#aboutClose');
    click('#logBtn'); await sleep(1500);
    ok('update log opens with 2.4', D.querySelector('#updatelog').classList.contains('show') && D.querySelector('#ulBody').textContent.includes('2.4'), {first: (D.querySelector('.ulver') || {}).textContent});
    click('#ulClose');
    click('#aboutPageBtn'); ok('about page', D.querySelector('#aboutPage').classList.contains('show')); click('#aboutPageClose');
    click('.ph'); ok('sidebar panel opens', !!D.querySelector('.panel.open'));
    r.errors = (W().__ERRORS || []).slice(0, 5); r.passed = r.steps.filter(x => x.ok).length; r.total = r.steps.length;
    await fetch('http://127.0.0.1:8901/' + q.get('smoke') + '.json', {method: 'POST', body: btoa(unescape(encodeURIComponent(JSON.stringify(r))))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('playsmooth')) {
    /* PLAYBACK CONTINUITY (round 2). Plays for ?secs= at ?speed= from ?age=
       at ?zoom= and samples every animation frame: the surface mode, the
       bound pair, mixf, the warp and material gates, whether the clouds are
       drawn, and the age. Reports the share of frames at full detail, the
       frames time held for a pair or a sheet, the largest age step between
       consecutive frames against the expected step, any frame where the
       shown pair moved by more than one keyframe (a jump), any frame where
       mixf fell by more than half without the pair changing (a snap), and
       the path flips. */
    const secs = +q.get('secs') || 15;
    const o = {age: +(q.get('age') || 300), w: 1280, h: 960, zoom: +(q.get('zoom') || 2.2)};
    const aim = A.lookAt(+(q.get('lon') || 20), +(q.get('lat') || 10), o);
    await sleep(7000);
    for (let k = 0; k < 10; k++) { A.step(); await sleep(150); }
    A.state.speed = +(q.get('speed') || 3); A.state.dir = -1;
    const st0 = A.sheets.status();
    const surf = () => A.surface ? A.surface() : shown();               // the old page has no account of its own
    const wx0 = () => A.weather ? A.weather() : {globe: A.gl.clouds.visible, map: false, time: 0};
    const u = A.gl.mat.uniforms, orf = W().requestAnimationFrame.bind(W());
    const samples = []; let prev = null;
    const t1 = performance.now();
    A.state.playing = true;
    await new Promise(res => {
      const tick = now => {
        const s = surf(), sh = A.sheets.status(), wx = wx0();
        const rec = {t: +(now - t1).toFixed(0), age: +A.state.age.toFixed(3), mode: s.mode, i: s.shown[0], j: s.shown[1],
                     mixf: +u.mixf.value.toFixed(3), warp: u.uWarp.value, mat: u.uMat.value, lite: sh.lite,
                     clouds: !!(wx.globe || wx.map), wt: wx.time};
        samples.push(rec); prev = rec;
        if (now - t1 < secs * 1000 && A.state.playing) orf(tick); else res();
      };
      orf(tick);
    });
    A.state.playing = false;
    const st1 = A.sheets.status();
    const full = samples.filter(x => x.mode === 'full').length;
    const dts = [], steps = []; let jumps = 0, snaps = 0, flips = 0, cloudFrames = 0, warpOff = 0;
    for (let k = 1; k < samples.length; k++) {
      const a = samples[k - 1], b = samples[k];
      dts.push(b.t - a.t); steps.push(a.age - b.age);
      if (Math.abs(b.i - a.i) > 1 && a.i >= 0 && b.i >= 0) jumps++;
      if (b.i === a.i && b.j === a.j && a.mixf - b.mixf > 0.5) snaps++;
      if (b.lite !== a.lite) flips++;
      if (b.clouds) cloudFrames++;
      if (b.i !== b.j && b.warp < 0.5 && b.mode === 'full') warpOff++;
    }
    dts.sort((x, y) => x - y); const sSteps = [...steps].sort((x, y) => x - y);
    const expected = A.state.speed / 60;
    const out = {aim: aim.ok, secs, speed: A.state.speed, frames: samples.length,
                 fps: +(samples.length / secs).toFixed(1), fullPct: +(full / samples.length * 100).toFixed(1),
                 modes: samples.reduce((m, x) => (m[x.mode] = (m[x.mode] || 0) + 1, m), {}),
                 frameMsP50: dts[dts.length >> 1], frameMsP95: dts[Math.floor(dts.length * 0.95)], frameMsMax: dts[dts.length - 1],
                 ageStepMax: +sSteps[sSteps.length - 1].toFixed(3), ageStepP95: +sSteps[Math.floor(sSteps.length * 0.95)].toFixed(3),
                 zeroSteps: steps.filter(x => x === 0).length, expectedStepAt60fps: +expected.toFixed(3),
                 pairJumps: jumps, mixfSnaps: snaps, pathFlips: flips, warpOffFrames: warpOff,
                 cloudFramesPct: +(cloudFrames / Math.max(1, samples.length - 1) * 100).toFixed(1),
                 weatherAdvanced: +(samples[samples.length - 1].wt - samples[0].wt).toFixed(2),
                 holds: {sheet: st1.holds - st0.holds, field: (st1.fieldHolds || 0) - (st0.fieldHolds || 0)}, bakes: (st1.bakes || 0) - (st0.bakes || 0),
                 litePct: +(samples.filter(x => x.lite).length / samples.length * 100).toFixed(1),
                 ageFrom: samples[0].age, ageTo: samples[samples.length - 1].age,
                 sheets: {w: st1.shippedW, dir: st1.dir, keep: st1.keep, held: st1.held},
                 errors: (W().__ERRORS || []).slice(0, 5), samples: samples.filter((x, i) => i % 10 === 0)};
    await fetch('http://127.0.0.1:8901/' + q.get('playsmooth') + '.json', {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('weathertest')) {
    /* CLOUD MOTION WITH A FIXED CAMERA. Two shots ?secs= apart at one age and
       one camera (their pixel difference is measured afterwards by
       verify_run.py), then Play and Pause to confirm the clouds leave and
       come back. APP.weather() is the new page's own account of itself. */
    const name = q.get('weathertest'), secs = +q.get('secs') || 20;
    const o = {age: +(q.get('age') || 0), w: 1280, h: 960, zoom: +(q.get('zoom') || 2.8)};
    if (q.get('gtilt')) o.gtilt = +q.get('gtilt');
    const aim = A.lookAt(+(q.get('lon') || 20), +(q.get('lat') || 10), o);
    await sleep(7000);
    for (let k = 0; k < 20; k++) { A.step(); await sleep(150); }
    const wx = () => A.weather ? A.weather() : {globe: A.gl.clouds.visible, uCloud: A.gl.clouds.material.uniforms.uCloud.value};
    // the layer fades in over 1.4 s and the image blends in as it lands: shoot only once both are complete
    let settled = 0;
    for (let t = 0; t < 120; t++) {
      const w = wx();
      if (!A.weather || (w.fade >= 1 && (w.blend >= 1 || !w.image) && w.image)) { settled++; if (settled >= 3) break; } else settled = 0;
      await sleep(250);
    }
    const st0 = wx(), age0 = A.state.age, tA = performance.now();
    const ra = await A.shoot(name + '_a', 900, undefined, undefined, {labels: false});
    await sleep(secs * 1000);
    const st1 = wx(), tB = performance.now();
    const rb = await A.shoot(name + '_b', 900, undefined, undefined, {labels: false});
    A.state.playing = true; A.step(); await sleep(500); A.step();
    const play = wx(), playAge = A.state.age;
    A.state.playing = false; A.step();
    await sleep(4000); for (let k = 0; k < 5; k++) { A.step(); await sleep(100); }
    const paused = wx();
    await fetch('http://127.0.0.1:8901/' + name + '.json',
                {method: 'POST', body: btoa(JSON.stringify({aim: aim.ok, ageA: age0, ageB: +A.state.age.toFixed(3), secs: +((tB - tA) / 1000).toFixed(2),
                  shotA: !!ra.saved, shotB: !!rb.saved, shotErr: [ra.error || null, rb.error || null], canvas: [A.gl.renderer.domElement.width, A.gl.renderer.domElement.height],
                  frames: A.loader().frame, before: st0, after: st1, play: {age: +playAge.toFixed(2), ...play}, paused,
                  errors: (W().__ERRORS || []).slice(0, 5)}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('timing')) {
    const R = A.gl.renderer, gl = R.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const glr = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
    const to = {age: +(q.get('age') || 0), w: 1280, h: 720};
    if (q.get('zoom')) to.zoom = +q.get('zoom');
    if (q.get('gtilt')) to.gtilt = +q.get('gtilt');
    if (q.get('head')) to.head = +q.get('head');
    const aim = A.lookAt(+(q.get('lon') || 0), +(q.get('lat') || 20), to);
    await sleep(+q.get('wait') || 6000);                 // let the fields land
    if (q.get('playing')) { A.state.playing = true; A.state.speed = +(q.get('speed') || 3); }   // time a PLAYING frame (direct render, clouds on)
    R.setPixelRatio(2); R.setSize(1280, 720, false);
    A.gl.cam.aspect = 1280 / 720; A.gl.cam.updateProjectionMatrix();
    const px = new Uint8Array(4);
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    /* Yield between steps: a forced step lands no promise, so twenty-one
       back to back let no decode arrive, and a playing pair timed out into a
       still (round 2). The yield is outside the timed span. */
    const tick = () => new Promise(r => setTimeout(r, 0));
    for (let i = 0; i < 6; i++) { A.step(); sync(); await tick(); }
    const a = [];
    /* The app's own frame runs during the yield; the first sync drains its
       GPU work so the timed span is the forced frame alone. */
    for (let i = 0; i < 15; i++) { await tick(); sync(); const t = performance.now(); A.step(); sync(); a.push(performance.now() - t); }
    a.sort((x, y) => x - y);
    const mid = new Uint8Array(4);
    gl.readPixels(gl.drawingBufferWidth >> 1, gl.drawingBufferHeight >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, mid);
    const out = {glr, buf: [gl.drawingBufferWidth, gl.drawingBufferHeight],
                 aimOk: aim.ok, p50: +a[7].toFixed(1), min: +a[0].toFixed(1),
                 center: Array.from(mid).slice(0, 3),
                 lutInFrag: A.gl.mat.fragmentShader.includes('(t0+xy)*(1.0/528.0)'),
                 uNzBound: !!A.gl.mat.uniforms.uNz.value,
                 p95: +a[13].toFixed(1), max: +a[14].toFixed(1), samples: a.length,
                 path: A.sheets ? (A.sheets.status().lite ? 'sheets' : 'terrain') : 'terrain',
                 shown: shown(), clouds: !!(A.gl.clouds && A.gl.clouds.visible && A.gl.clouds.material.visible),
                 scale: +R.getPixelRatio().toFixed(2), mem: W().__MEM ? W().__MEM() : null,
                 glTextures: R.info.memory.textures, triangles: R.info.render.triangles};
    await fetch('http://127.0.0.1:8901/' + q.get('timing') + '.json',
                {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('soak')) {
    /* THE CRASH SOAK. Simulates real use under the app's own rAF loop:
       playback on, auto-rotate on, a far jump every ~20 s, view flips --
       for ?mins= minutes, sampling the pinned-memory diagnostic throughout.
       If decoded-image residency is unbounded (the 2026-07-30 crash), the
       samples climb toward gigabytes and the tab dies before the report
       posts; bounded residency holds flat and the report arrives. */
    const mins = +q.get('mins') || 5;
    A.state.playing = true; A.state.layers.rotate = true;
    A.state.layers.hotspots = true; A.state.layers.boundaries = true;
    const samples = [];
    const t1 = Date.now();
    const jumps = [700, 66, 300, -100, 0, 450, 850, 150];
    let j = 0;
    while (Date.now() - t1 < mins * 60000) {
      await sleep(5000);
      const m = W().__MEM ? W().__MEM() : {};
      m.t = Math.round((Date.now() - t1) / 1000);
      m.heapMB = W().performance.memory ? Math.round(W().performance.memory.usedJSHeapSize / 1048576) : null;
      m.scale = +A.gl.renderer.getPixelRatio().toFixed(2);
      samples.push(m);
      if (m.t % 20 < 5) { A.state.age = jumps[j++ % jumps.length]; }
      if (m.t % 60 < 5) { A.state.view = (A.state.view === 'globe' ? 'map' : 'globe'); }
    }
    await fetch('http://127.0.0.1:8901/' + q.get('soak') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({mins, errors: (W().__ERRORS || []).slice(0, 5), samples}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('scrub')) {
    /* FAST-SCRUB REPRO. Sweeps the age like a user dragging the slider hard
       (0 -> 900 Ma in ~1.2 s), then watches the centre of the globe: a blank
       (all-black) crop is the failure the user reported -- the bound pair got
       evicted mid-scrub and the target pair had not decoded yet. Reports how
       long the globe stayed blank after the sweep ended. */
    A.state.age = 0;
    await sleep(3500);                          // settle at present
    const orf2 = W().requestAnimationFrame.bind(W());
    const seen = new Set();
    await new Promise(res => {
      const t2 = performance.now();
      const stepFn = () => {
        const k = (performance.now() - t2) / 3200;
        A.state.age = Math.min(900, k * 900);
        if (W().__MEM) seen.add(W().__MEM().boundE);
        if (k < 1) orf2(stepFn); else res();
      };
      orf2(stepFn);
    });
    const samples = [];
    const t3 = Date.now();
    let renderedAt = -1;
    while (Date.now() - t3 < 8000) {
      const blank = !!A.snap(32, 32).error;    // all-black centre crop
      samples.push({t: Date.now() - t3, blank});
      if (!blank && renderedAt < 0) { renderedAt = Date.now() - t3; break; }
      await sleep(120);
    }
    await fetch('http://127.0.0.1:8901/' + q.get('scrub') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({
                  blankMs: renderedAt, statesShownDuringSweep: seen.size,
                  blankSamples: samples.filter(s=>s.blank).length,
                  samples: samples.length, errors: (W().__ERRORS || []).slice(0, 4)}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('coherence')) {
    /* PLAYBACK BIND COHERENCE. At 18 Myr/s a keyframe crossing arrives every
       ~0.28 s; if the new interval's displacement (_v) or material (_p)
       textures are not bound the moment the pair advances, uWarp/uMat drop
       and the world falls back to the plain cross-fade mid-playback -- the
       "jagged, jumpy evolution" report. Samples the gates every frame during
       a fast playback run; reports the fraction of frames fully coherent. */
    const secs = +q.get('secs') || 45;
    A.state.age = 400; 
    await sleep(4000);                       // let the window seed
    A.state.playing = true; A.state.dir = 1; // deep-past-ward, steady crossings
    const u = A.gl.mat.uniforms;
    let frames = 0, warpOn = 0, matOn = 0, bothOn = 0, elevPairs = new Set();
    const t1 = Date.now();
    const orf = W().requestAnimationFrame.bind(W());
    const sample = () => {
      frames++;
      const w = u.uWarp.value > 0.5, m = u.uMat.value > 0.5;
      if (w) warpOn++; if (m) matOn++; if (w && m) bothOn++;
      if (Date.now() - t1 < secs * 1000) orf(sample);
    };
    orf(sample);
    await sleep(secs * 1000 + 1500);
    A.state.playing = false;
    const out = {frames, fps: +(frames / secs).toFixed(1),
                 warpPct: +(warpOn / frames * 100).toFixed(1),
                 matPct: +(matOn / frames * 100).toFixed(1),
                 bothPct: +(bothOn / frames * 100).toFixed(1),
                 span: [400, +A.state.age.toFixed(0)]};
    await fetch('http://127.0.0.1:8901/' + q.get('coherence') + '.json',
                {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('storm')) {
    /* THE STORM GATE (perf audit P9). A keyframe crossing must not pay a
       synchronous decode+upload pile on the render path -- that was the
       ~153 ms hitch this audit started from. Counts texture uploads landing
       inside the crossing frame itself, after the warmers have had time to
       do their job. Count-based, not time-based: valid even when headless
       falls back to software GL. */
    A.state.age = 152;
    for (let k = 0; k < 24; k++) { A.step(); await sleep(350); }   // fetch + warm
    for (let k = 0; k < 60; k++) A.step();                          // drain queue
    const gl = A.gl.renderer.getContext();
    const proto = Object.getPrototypeOf(gl);
    let count = 0;
    for (const nm of ['texImage2D', 'texSubImage2D', 'texStorage2D']) {
      const orig = proto[nm];
      proto[nm] = function(...args) { count++; return orig.apply(this, args); };
    }
    const crossings = [];
    for (const a of [155.2, 160.3, 152.1]) {
      for (let k = 0; k < 30; k++) A.step();                        // settle + drain
      count = 0;
      A.state.age = a;
      const t = performance.now(); A.step();
      crossings.push({age: a, ms: +(performance.now() - t).toFixed(1), uploads: count});
    }
    await fetch('http://127.0.0.1:8901/' + q.get('storm') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({crossings}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('playtest')) {
    /* PLAYBACK ON THE SHEET PATH (2026-09-03). Zoomed out, the globe draws
       from the sheets, and a crossing whose sheet had not landed used to drop
       the frame to the terrain shader: smooth, then a burst of lag. Plays at
       ?speed= (default the top speed, 10) on the sheet path for ?secs= and
       reports the frames drawn from sheets against all frames, the frames
       playback held for a sheet, the most sheets held on the GPU, and every
       time the path flipped. Pixel ratio 1 (quality 'perf'), so the sheets
       engage on any display at zoom 5. */
    A.state.quality = 'perf';
    if (q.get('sheetdelay')) {
      // ?sheetdelay=ms: every sheet fetch waits this long first, standing in
      // for a CDN round trip -- from localhost a sheet lands in tens of ms and
      // nothing is ever late, which is not what the live site sees.
      const of = W().fetch.bind(W()), d = +q.get('sheetdelay');
      W().fetch = (u, o) => String(u).includes('sheets/') ? sleep(d).then(() => of(u, o)) : of(u, o);
    }
    A.lookAt(20, 20, {age: +(q.get('age') || 600), zoom: 5, w: 1280, h: 960});
    await sleep(6000);
    for (let k = 0; k < 20; k++) { A.step(); await sleep(150); }   // the pair's sheets land
    const st0 = A.sheets.status(), fr0 = A.loader().frame;
    A.state.speed = +(q.get('speed') || 10); A.state.dir = -1; A.state.playing = true;
    const t1 = performance.now(); const samples = []; let flips = 0, last = null, heldMax = 0;
    while (performance.now() - t1 < +(q.get('secs') || 8) * 1000) {
      await sleep(100);
      const s = A.sheets.status();
      if (last !== null && s.lite !== last) flips++;
      last = s.lite; heldMax = Math.max(heldMax, s.held);
      samples.push({t: Math.round(performance.now() - t1), age: +A.state.age.toFixed(1), lite: s.lite, holds: s.holds - st0.holds, held: s.held});
    }
    A.state.playing = false;
    const st1 = A.sheets.status(), fr1 = A.loader().frame;
    await fetch('http://127.0.0.1:8901/' + q.get('playtest') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({
                  startLite: st0.lite, ready0: st0.ready.length, frames: fr1 - fr0,
                  liteFrames: st1.frames - st0.frames, holds: st1.holds - st0.holds, heldMax, flips,
                  ageFrom: samples.length ? samples[0].age : null, ageTo: +A.state.age.toFixed(1),
                  samples: samples.filter((x, i) => i % 5 === 0)}))});
    document.title = 'VERIFY-DONE'; return;
  }
  if (q.get('evalq')) {
    // Generic in-app probe: ?evalq=NAME&expr=<js>&age=<Ma>. Reports whatever
    // the expression returns, after the fields for that age have landed.
    if (q.get('age') != null) {
      // Honour a framing when one is given -- a probe that cannot aim can only
      // ever report about lon 0, lat 20, which is open ocean for most ages.
      A.lookAt(+(q.get('lon') || 0), +(q.get('lat') || 20),
               {age: +q.get('age'), zoom: +(q.get('zoom') || 1),
                w: +(q.get('w') || 1280), h: +(q.get('h') || 960)});
    }
    await sleep(+q.get('wait') || 12000);
    for (let k = 0; k < 8; k++) { A.step(); await sleep(200); }
    const out = (0, W().eval)(q.get('expr'));
    await fetch('http://127.0.0.1:8901/' + q.get('evalq') + '.json',
                {method: 'POST', body: btoa(String(out))});
    document.title = 'VERIFY-DONE'; return;
  }
  if (q.get('rivdbg')) {
    if (q.get('rivage') != null) {
      A.lookAt(-100, 44, {age: +q.get('rivage'), zoom: 1.9, w: 1280, h: 960});
      await sleep(12000);
      for (let k = 0; k < 8; k++) { A.step(); await sleep(200); }
    } else await sleep(7000);
    A.step(); A.step();
    const info = (0, W().eval)(
      `(function(){` +
      ` const ch=overlay.rivers.children.length;` +
      ` let nan=0, ndc=null, n=0;` +
      ` if(ch){ const p=overlay.rivers.children[0].geometry.attributes.position; n=p.count;` +
      `  for(let i=0;i<p.count*3;i++) if(!isFinite(p.array[i])) nan++;` +
      `  const v=new THREE.Vector3(p.getX(0),p.getY(0),p.getZ(0))` +
      `    .applyMatrix4(globe.matrixWorld).project(APP.gl.cam);` +
      `  ndc=[+v.x.toFixed(2),+v.y.toFixed(2),+v.z.toFixed(3)]; }` +
      ` let found=0; APP.gl.scene.traverse(function(o){if(ch&&o===overlay.rivers.children[0])found=1;});` +
      ` const sg=RIVDATA.get(curFrame().i)||[]; let nn=0, ss=0;` +
      ` for(const g of sg){ if(g[1]>0)nn++; else ss++; }` +
      ` const c2=APP.gl.renderer.domElement; let pass=0,occl=0,horiz=0,off=0;` +
      ` for(const g of sg){ let on=true; const pts=[];` +
      `  for(const pr of [[g[0],g[1]],[g[2],g[3]]]){` +
      `   const lp=ll2v(pr[0],pr[1],1.004);` +
      `   const wp=lp.clone().applyMatrix4(globe.matrixWorld);` +
      `   const nr=lp.clone().applyQuaternion(globe.quaternion).normalize();` +
      `   if(nr.dot(cam.position.clone().sub(wp).normalize())<0.10){on=false;break;}` +
      `   const v=wp.project(cam);` +
      `   pts.push([(v.x*0.5+0.5)*c2.width,(1-(v.y*0.5+0.5))*c2.height]); }` +
      `  if(!on){occl++;continue;}` +
      `  if(Math.abs(pts[0][0]-pts[1][0])>=60){horiz++;continue;}` +
      `  const X=pts[0][0],Y=pts[0][1];` +
      `  if(X<0||Y<0||X>c2.width||Y>c2.height){off++;continue;}` +
      `  pass++; }` +
      ` let amzOK=0, amzShift=0, amzMirror=0;` +
      ` for(const g of sg){ if(Math.abs(g[1])<10){` +
      `  if(g[0]>-80&&g[0]<-40)amzOK++;` +
      `  if(g[0]>100&&g[0]<140)amzShift++;` +
      `  if(g[0]>40&&g[0]<80)amzMirror++; } }` +
      ` return JSON.stringify({ch, n, nan, ndc, found, north:nn, south:ss, pass, occl, horiz, off, amzOK, amzShift, amzMirror, want:_rivWant, fi:curFrame().i,` +
      `  vis:overlay.rivers.visible, gvis:globe.visible});})()`);
    await fetch('http://127.0.0.1:8901/' + q.get('rivdbg') + '.json',
                {method: 'POST', body: btoa(info)});
    await A.shoot(q.get('rivdbg') + '_shot', 960);
    document.title = 'VERIFY-DONE'; return;
  }
  if (q.get('bake')) {
    /* SHEET BAKE (WP-10, plan A3). ?bake=i0-i1 renders each keyframe's world
       sheet inside the app on this machine's GPU and POSTs it to the receiver
       as an RGBA PNG, north up, alpha = ocean mask. build/bake_sheets.py drives
       this and encodes the result into web/sheets/. Residency first: the app
       decodes a keyframe's fields only near the age it is showing, so jump
       there, then let bake() report pending until every kind has landed. */
    const [i0, i1] = q.get('bake').split('-').map(Number);
    const W = +(q.get('sheet') || 4096);
    for (let i = i0; i <= i1; i++) {
      A.jumpTo(A.DATA.timeline[i].age);
      /* No A.step() while waiting: a step renders the whole globe through the
         terrain shader, which on software GL is half a minute a poll. bake()
         itself kicks the decodes it is missing and reports pending until they
         land; nothing else is needed to make them land. */
      let r = null;
      for (let t = 0; t < 600; t++) { r = A.sheets.bake(i); if (r.ready || r.error) break; await sleep(250); }
      if (!(r && r.ready)) { console.log('bake', i, 'FAILED', JSON.stringify(r)); continue; }
      const p = A.sheets.png(i);
      if (p.error) { console.log('bake', i, 'ERROR', p.error); continue; }
      const resp = await fetch('http://127.0.0.1:8901/sheet_' + String(i).padStart(3, '0') + '.png',
                               {method: 'POST', body: p.png});
      console.log('bake', i, p.w + 'x' + p.h, 'saved', await resp.text());
    }
    document.title = 'VERIFY-DONE'; return;
  }
  for (const s of shots) {
    const o = {age: s.age, w: 1280, h: 960};
    if (s.zoom != null) o.zoom = s.zoom;
    if (s.gtilt != null) o.gtilt = s.gtilt;
    if (s.head != null) o.head = s.head;
    const aim = A.lookAt(s.lon, s.lat, o);
    await sleep(+q.get('settle') || 2600);
    if (q.get('quick')) {
      /* QUICK MODE (round 3). The camera is derived from the state directly
         (no tween on rot, tilt or zoom), so the still loop below only costs
         renders -- six a framing, each a full software-GL frame here. Wait
         for the fields instead: poll the residency diagnostic with no step
         until nothing is decoding and the settled-fetch count has stopped
         moving, then render once and shoot. */
      let last = -1, calm = 0;
      for (let t = 0; t < 400 && calm < 3; t++) {
        await sleep(250);
        const m = W().__MEM ? W().__MEM() : {tried: 0, pendingDecodes: 0};
        calm = (m.pendingDecodes === 0 && m.tried === last) ? calm + 1 : 0;
        last = m.tried;
      }
      A.step();
      const r = await A.shoot(s.name, +(q.get('shotsize') || 760), undefined, undefined,
                              {labels: q.get('nolabels') ? false : true});
      console.log('shot', s.name, JSON.stringify({aim: aim.ok, off: aim.offNDC, quick: true, tried: last, saved: !!r.saved, err: r.error || null}));
      continue;
    }
    /* WAIT FOR THE CAMERA TO ACTUALLY STOP (2026-07-31). lookAt tweens, the
       tween outlasts any fixed settle when the zoom changes a lot, and the
       app BOOTS far out -- so every first-slot shot all day was a mid-tween
       frame that happened to look like a plausible wide view. Poll the
       camera until it is still; the fixed settle above remains the floor
       (fields need it to decode). */
    const cam = A.gl.cam;
    let still = 0;
    for (let t = 0; t < 100 && still < 3; t++) {
      const p0 = cam.position.clone();
      await sleep(150);
      A.step();
      still = cam.position.distanceTo(p0) < 1e-5 ? still + 1 : 0;
    }
    A.step(); A.step();
    /* SIZE IS A PARAMETER, and it changes what the frame contains. The ocean
       fabric and the land detail octaves are anti-aliased against radians per
       pixel, so a 760 px capture fades out orders a real browser at 1280-2560
       still draws: measured at the Hawaii framing, the abyss came back with a
       high-pass sigma of 2.3 against land's 41.8 and read as featureless water,
       which is the capture under-sampling and not the sea floor. Default stays
       760 so every earlier shot remains comparable. */
    /* Labels are drawn into the capture, and white text with a black outline is
       the largest gradient in any ocean frame -- a seam hunt run with them on
       finds the lettering every time. */
    const r = await A.shoot(s.name, +(q.get('shotsize') || 760), undefined, undefined,
                            {labels: q.get('nolabels') ? false : true});
    console.log('shot', s.name, JSON.stringify({aim: aim.ok, off: aim.offNDC, still, saved: !!r.saved, err: r.error || null}));
  }
  document.title = 'VERIFY-DONE';
})();
</script>
