<!doctype html>
<!-- Headless verification driver — a PERMANENT dev tool. It never deploys:
     build_site.py copies an explicit whitelist and this is not on it.
     All modes POST results to build/verify_server.py on :8901.
       ?shots=name,lon,lat,age[,zoom];...   screenshot set via APP.lookAt/shoot
       ?timing=NAME                         frame-time p50 at 2560x1440 -> NAME.json.png
       ?storm=NAME                          keyframe-crossing upload storm -> NAME.json.png
       ?pin=1                               freeze time (uTime + dt) for exact A/B
       ?oldnoise=1                          passed through to the app iframe
       ?layers=1                            turn hotspot/vector/boundary layers on -->
<meta charset="utf-8">
<title>verify driver</title>
<iframe id="app" style="width:1280px;height:960px;border:0"></iframe>
<script>
const q = new URLSearchParams(location.search);
const passthrough = ['oldnoise','zeronoise'].filter(k => q.get(k)).map(k => '&' + k + '=1').join('');
document.getElementById('app').src = 'index.html?run=verify' + passthrough;
const shots = (q.get('shots') || '').split(';').filter(Boolean).map(s => {
  const [name, lon, lat, age, zoom] = s.split(',');
  return {name, lon: +lon, lat: +lat, age: +age, zoom: zoom ? +zoom : null};
});
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => document.getElementById('app').contentWindow;
(async () => {
  let t0 = Date.now();
  while (!(W() && W().APP) && Date.now() - t0 < 60000) await sleep(300);
  if (!(W() && W().APP)) { document.title = 'VERIFY-FAIL-BOOT'; return; }
  const A = W().APP;
  if (q.get('pin')) {
    // Freeze the clock that reaches loop(): uTime, cloud drift and the sea
    // sheen become deterministic, so two runs differ only by code under test.
    W().performance.now = () => 777000;
    const orf = W().requestAnimationFrame.bind(W());
    W().requestAnimationFrame = cb => orf(() => cb(777000));
  }
  if (q.get('layers')) { A.state.layers.hotspots = true; A.state.layers.vectors = true; A.state.layers.boundaries = true; }

  if (q.get('timing')) {
    const R = A.gl.renderer, gl = R.getContext();
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    const glr = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
    const aim = A.lookAt(0, 20, {age: 0, w: 1280, h: 720});
    await sleep(4000);                                   // let the age-0 fields land
    R.setPixelRatio(2); R.setSize(1280, 720, false);
    A.gl.cam.aspect = 1280 / 720; A.gl.cam.updateProjectionMatrix();
    const px = new Uint8Array(4);
    const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    for (let i = 0; i < 6; i++) A.step(); sync();
    const a = [];
    for (let i = 0; i < 15; i++) { const t = performance.now(); A.step(); sync(); a.push(performance.now() - t); }
    a.sort((x, y) => x - y);
    const mid = new Uint8Array(4);
    gl.readPixels(gl.drawingBufferWidth >> 1, gl.drawingBufferHeight >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, mid);
    const out = {glr, buf: [gl.drawingBufferWidth, gl.drawingBufferHeight],
                 aimOk: aim.ok, p50: +a[7].toFixed(1), min: +a[0].toFixed(1),
                 center: Array.from(mid).slice(0, 3),
                 lutInFrag: A.gl.mat.fragmentShader.includes('(t0+xy)*(1.0/528.0)'),
                 uNzBound: !!A.gl.mat.uniforms.uNz.value};
    await fetch('http://127.0.0.1:8901/' + q.get('timing') + '.json',
                {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('soak')) {
    /* THE CRASH SOAK. Simulates real use under the app's own rAF loop:
       playback on, auto-rotate on, a far jump every ~20 s, view flips --
       for ?mins= minutes, sampling the pinned-memory diagnostic throughout.
       If decoded-image residency is unbounded (the 2026-07-30 crash), the
       samples climb toward gigabytes and the tab dies before the report
       posts; bounded residency holds flat and the report arrives. */
    const mins = +q.get('mins') || 5;
    A.state.playing = true; A.state.layers.rotate = true;
    A.state.layers.hotspots = true; A.state.layers.boundaries = true;
    const samples = [];
    const t1 = Date.now();
    const jumps = [700, 66, 300, -100, 0, 450, 850, 150];
    let j = 0;
    while (Date.now() - t1 < mins * 60000) {
      await sleep(5000);
      const m = W().__MEM ? W().__MEM() : {};
      m.t = Math.round((Date.now() - t1) / 1000);
      m.heapMB = W().performance.memory ? Math.round(W().performance.memory.usedJSHeapSize / 1048576) : null;
      m.scale = +A.gl.renderer.getPixelRatio().toFixed(2);
      samples.push(m);
      if (m.t % 20 < 5) { A.state.age = jumps[j++ % jumps.length]; }
      if (m.t % 60 < 5) { A.state.view = (A.state.view === 'globe' ? 'map' : 'globe'); }
    }
    await fetch('http://127.0.0.1:8901/' + q.get('soak') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({mins, errors: (W().__ERRORS || []).slice(0, 5), samples}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('scrub')) {
    /* FAST-SCRUB REPRO. Sweeps the age like a user dragging the slider hard
       (0 -> 900 Ma in ~1.2 s), then watches the centre of the globe: a blank
       (all-black) crop is the failure the user reported -- the bound pair got
       evicted mid-scrub and the target pair had not decoded yet. Reports how
       long the globe stayed blank after the sweep ended. */
    A.state.age = 0;
    await sleep(3500);                          // settle at present
    const orf2 = W().requestAnimationFrame.bind(W());
    const seen = new Set();
    await new Promise(res => {
      const t2 = performance.now();
      const stepFn = () => {
        const k = (performance.now() - t2) / 3200;
        A.state.age = Math.min(900, k * 900);
        if (W().__MEM) seen.add(W().__MEM().boundE);
        if (k < 1) orf2(stepFn); else res();
      };
      orf2(stepFn);
    });
    const samples = [];
    const t3 = Date.now();
    let renderedAt = -1;
    while (Date.now() - t3 < 8000) {
      const blank = !!A.snap(32, 32).error;    // all-black centre crop
      samples.push({t: Date.now() - t3, blank});
      if (!blank && renderedAt < 0) { renderedAt = Date.now() - t3; break; }
      await sleep(120);
    }
    await fetch('http://127.0.0.1:8901/' + q.get('scrub') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({
                  blankMs: renderedAt, statesShownDuringSweep: seen.size,
                  blankSamples: samples.filter(s=>s.blank).length,
                  samples: samples.length, errors: (W().__ERRORS || []).slice(0, 4)}))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('coherence')) {
    /* PLAYBACK BIND COHERENCE. At 18 Myr/s a keyframe crossing arrives every
       ~0.28 s; if the new interval's displacement (_v) or material (_p)
       textures are not bound the moment the pair advances, uWarp/uMat drop
       and the world falls back to the plain cross-fade mid-playback -- the
       "jagged, jumpy evolution" report. Samples the gates every frame during
       a fast playback run; reports the fraction of frames fully coherent. */
    const secs = +q.get('secs') || 45;
    A.state.age = 400; 
    await sleep(4000);                       // let the window seed
    A.state.playing = true; A.state.dir = 1; // deep-past-ward, steady crossings
    const u = A.gl.mat.uniforms;
    let frames = 0, warpOn = 0, matOn = 0, bothOn = 0, elevPairs = new Set();
    const t1 = Date.now();
    const orf = W().requestAnimationFrame.bind(W());
    const sample = () => {
      frames++;
      const w = u.uWarp.value > 0.5, m = u.uMat.value > 0.5;
      if (w) warpOn++; if (m) matOn++; if (w && m) bothOn++;
      if (Date.now() - t1 < secs * 1000) orf(sample);
    };
    orf(sample);
    await sleep(secs * 1000 + 1500);
    A.state.playing = false;
    const out = {frames, fps: +(frames / secs).toFixed(1),
                 warpPct: +(warpOn / frames * 100).toFixed(1),
                 matPct: +(matOn / frames * 100).toFixed(1),
                 bothPct: +(bothOn / frames * 100).toFixed(1),
                 span: [400, +A.state.age.toFixed(0)]};
    await fetch('http://127.0.0.1:8901/' + q.get('coherence') + '.json',
                {method: 'POST', body: btoa(JSON.stringify(out))});
    document.title = 'VERIFY-DONE'; return;
  }

  if (q.get('storm')) {
    /* THE STORM GATE (perf audit P9). A keyframe crossing must not pay a
       synchronous decode+upload pile on the render path -- that was the
       ~153 ms hitch this audit started from. Counts texture uploads landing
       inside the crossing frame itself, after the warmers have had time to
       do their job. Count-based, not time-based: valid even when headless
       falls back to software GL. */
    A.state.age = 152;
    for (let k = 0; k < 24; k++) { A.step(); await sleep(350); }   // fetch + warm
    for (let k = 0; k < 60; k++) A.step();                          // drain queue
    const gl = A.gl.renderer.getContext();
    const proto = Object.getPrototypeOf(gl);
    let count = 0;
    for (const nm of ['texImage2D', 'texSubImage2D', 'texStorage2D']) {
      const orig = proto[nm];
      proto[nm] = function(...args) { count++; return orig.apply(this, args); };
    }
    const crossings = [];
    for (const a of [155.2, 160.3, 152.1]) {
      for (let k = 0; k < 30; k++) A.step();                        // settle + drain
      count = 0;
      A.state.age = a;
      const t = performance.now(); A.step();
      crossings.push({age: a, ms: +(performance.now() - t).toFixed(1), uploads: count});
    }
    await fetch('http://127.0.0.1:8901/' + q.get('storm') + '.json',
                {method: 'POST', body: btoa(JSON.stringify({crossings}))});
    document.title = 'VERIFY-DONE'; return;
  }

  for (const s of shots) {
    const o = {age: s.age, w: 1280, h: 960};
    if (s.zoom != null) o.zoom = s.zoom;
    const aim = A.lookAt(s.lon, s.lat, o);
    await sleep(+q.get('settle') || 2600);
    A.step(); A.step();
    const r = await A.shoot(s.name, 760);
    console.log('shot', s.name, JSON.stringify({aim: aim.ok, off: aim.offNDC, saved: !!r.saved, err: r.error || null}));
  }
  document.title = 'VERIFY-DONE';
})();
</script>
