<!doctype html><meta charset="utf-8"><title>t</title>
<style>html,body{margin:0;background:#000}iframe{width:760px;height:720px;border:0;display:block}</style>
<iframe id="f" src="index.html"></iframe>
<script>
const q=new URLSearchParams(location.search), f=document.getElementById('f');
f.onload=()=>{const W=f.contentWindow;let n=0,st=false;
 const t=setInterval(()=>{
  if(++n>900){document.title='TIMEOUT';clearInterval(t);return;}
  const A=W.APP; if(!A||!A.DATA||!A.DATA.timeline||!A.gl||!A.gl.renderer)return;
  if(!st){st=true;
   try{['clouds','atmo'].forEach(k=>{const o=A.gl[k];if(o&&o.parent)o.parent.remove(o);});
    A.state.layers.rotate=false;A.state.ambient=false;
    A.jumpTo(parseFloat(q.get('age')||'0'));
    A.state.rot=(parseFloat(q.get('lon'))-90)*Math.PI/180;
    A.state.tilt=parseFloat(q.get('tilt')||'0.6');
    A.state.zoom=parseFloat(q.get('zoom')||'1.8');
   }catch(e){document.title='ERR '+e.message;clearInterval(t);return;} return;}
  let ok=false; try{ok=!!A.elevField(A.curFrame().i);}catch(e){}
  if(!ok)return; clearInterval(t);
  setTimeout(()=>{W.requestAnimationFrame=()=>0;for(let i=0;i<6;i++)A.step();document.title='READY';},1300);
 },90);};
</script>
