<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 526" width="1180" height="526">
<style>
  .bg{fill:#11161c}
  .panel{fill:#161d25;stroke:#2a3644;stroke-width:1}
  .t{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#d8e2ec}
  .title{font-size:19px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:11.5px;fill:#8fa3b8}
  .lab{font-size:11px}
  .small{font-size:9.5px;fill:#9fb2c6}
  .tick{stroke:#3a4756;stroke-width:1}
  .axis{stroke:#5b6b7d;stroke-width:1.2}
  .grid{stroke:#232d39;stroke-width:1}
  .lead{stroke:#4d5f73;stroke-width:1;stroke-dasharray:2 2}
</style>
<rect class="bg" x="0" y="0" width="1180" height="526"/>
<text class="t title" x="28" y="34">Oxygen through Earth history</text>
<text class="t sub" x="28" y="53">Schematic; see research/05-atmosphere-ocean-chemistry for the evidence</text>
<rect class="panel" x="150" y="120" width="700" height="350" rx="4"/>
<line class="grid" x1="150" y1="450.9" x2="850" y2="450.9"/>
<text class="t small" x="142" y="454.9" text-anchor="end">0.001%</text>
<line class="grid" x1="150" y1="323.7" x2="850" y2="323.7"/>
<text class="t small" x="142" y="327.7" text-anchor="end">0.1%</text>
<line class="grid" x1="150" y1="260.1" x2="850" y2="260.1"/>
<text class="t small" x="142" y="264.1" text-anchor="end">1%</text>
<line class="grid" x1="150" y1="196.6" x2="850" y2="196.6"/>
<text class="t small" x="142" y="200.6" text-anchor="end">10%</text>
<line class="grid" x1="150" y1="133.0" x2="850" y2="133.0"/>
<text class="t small" x="142" y="137.0" text-anchor="end">100% PAL</text>
<line class="grid" x1="150.0" y1="120" x2="150.0" y2="470"/>
<text class="t small" x="150.0" y="486.0" text-anchor="middle">4000</text>
<line class="grid" x1="189.7" y1="120" x2="189.7" y2="470"/>
<text class="t small" x="189.7" y="486.0" text-anchor="middle">2500</text>
<line class="grid" x1="266.9" y1="120" x2="266.9" y2="470"/>
<text class="t small" x="266.9" y="486.0" text-anchor="middle">1000</text>
<line class="grid" x1="325.3" y1="120" x2="325.3" y2="470"/>
<text class="t small" x="325.3" y="486.0" text-anchor="middle">500</text>
<line class="grid" x1="460.5" y1="120" x2="460.5" y2="470"/>
<text class="t small" x="460.5" y="486.0" text-anchor="middle">100</text>
<line class="grid" x1="791.5" y1="120" x2="791.5" y2="470"/>
<text class="t small" x="791.5" y="486.0" text-anchor="middle">0</text>
<text class="t small" x="500.0" y="504.0" text-anchor="middle">Ma (log)</text>
<polyline points="150.0,450.9 186.3,450.9 191.4,241.0 196.0,147.1 198.5,135.9 202.4,158.3 206.4,215.7 217.4,229.8 251.6,229.8 275.8,215.7 285.7,196.6 297.0,177.4 310.0,158.3 318.7,147.1 338.0,147.1 344.1,140.9 353.0,130.3 368.3,121.8 374.1,122.7 383.7,140.9 402.4,147.1 426.6,139.1 460.5,134.4 518.2,133.0 791.5,133.0" fill="none" stroke="#7fc4a0" stroke-width="2.4"/>
<line x1="191.0" y1="126" x2="191.0" y2="466" stroke="#c9a227" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="196.7" y1="126" x2="196.7" y2="466" stroke="#e0a070" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="204.4" y1="126" x2="204.4" y2="466" stroke="#e07650" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="232.7" y1="126" x2="232.7" y2="466" stroke="#8fa3b8" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="297.0" y1="126" x2="297.0" y2="466" stroke="#7ebad6" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<line x1="368.3" y1="126" x2="368.3" y2="466" stroke="#7fc4a0" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>
<text class="t small" x="197.0" y="454.0" text-anchor="start">Great Oxidation Event</text>
<text class="t small" x="206.4" y="439.0" text-anchor="start">Lomagundi overshoot, then crash</text>
<text class="t small" x="238.7" y="424.0" text-anchor="start">the 'boring billion'</text>
<text class="t small" x="303.0" y="409.0" text-anchor="start">Neoproterozoic Oxygenation</text>
<text class="t small" x="362.3" y="394.0" text-anchor="end">Permo-Carboniferous peak ~30%</text>
<rect class="panel" x="876" y="120" width="270" height="350" rx="6"/>
<text class="t small" x="890" y="140">A schematic of the consensus SHAPE, not a data series -</text>
<text class="t small" x="890" y="153.4">the absolute values before the Phanerozoic carry</text>
<text class="t small" x="890" y="166.8">large uncertainty and the curve is drawn on a log</text>
<text class="t small" x="890" y="180.20000000000002">axis in both directions for that reason.</text>
<text class="t small" x="890" y="193.60000000000002"></text>
<text class="t small" x="890" y="207.00000000000003">What each step is FOR:</text>
<text class="t small" x="890" y="220.40000000000003"></text>
<text class="t small" x="890" y="233.80000000000004">GOE (2.46-2.06 Ga) oxidises methane, collapses the</text>
<text class="t small" x="890" y="247.20000000000005">  greenhouse, and freezes the planet (Huronian).</text>
<text class="t small" x="890" y="260.6">  Banded iron formations stop; red beds start; an</text>
<text class="t small" x="890" y="274.0">  ozone layer forms. &gt;2,500 of Earth's ~4,500</text>
<text class="t small" x="890" y="287.4">  minerals date from it.</text>
<text class="t small" x="890" y="300.79999999999995"></text>
<text class="t small" x="890" y="314.19999999999993">Lomagundi-Jatuli (~2.3 Ga) overshoots near modern</text>
<text class="t small" x="890" y="327.5999999999999">  levels, then crashes at ~2.1 Ga. Not a ramp.</text>
<text class="t small" x="890" y="340.9999999999999"></text>
<text class="t small" x="890" y="354.39999999999986">The boring billion holds a few percent PAL with</text>
<text class="t small" x="890" y="367.79999999999984">  euxinic mid-depths. Eukaryotes exist and do not</text>
<text class="t small" x="890" y="381.1999999999998">  radiate.</text>
<text class="t small" x="890" y="394.5999999999998"></text>
<text class="t small" x="890" y="407.9999999999998">NOE (~850-540 Ma) is the permissive condition for</text>
<text class="t small" x="890" y="421.39999999999975">  large animals: an organism metres across with no</text>
<text class="t small" x="890" y="434.7999999999997">  circulation needs an oxygenated water column.</text>
<text class="t small" x="890" y="448.1999999999997"></text>
<text class="t small" x="890" y="461.5999999999997">The Permo-Carboniferous peak is the coal forests'</text>
<text class="t small" x="890" y="474.99999999999966">  buried carbon. ~30%, not 35%.</text>
</svg>