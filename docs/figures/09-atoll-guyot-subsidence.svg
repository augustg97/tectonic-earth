<text class="t small" x="979.0" y="336" text-anchor="middle" fill="#c9a227">4. guyot</text>
<text class="t small" x="979.0" y="350" text-anchor="middle">reef drowned; flat wave-cut top</text>
<text class="t small" x="44" y="380">The island does not sink because it is heavy. It sinks because the sea floor it stands on is cooling: oceanic</text>
<text class="t small" x="44" y="394">lithosphere contracts and subsides as it ages, by roughly 350 m for every square root of a million years.</text>
<text class="t small" x="44" y="408">So every volcanic island rides slowly downward, and whether it becomes an atoll or a guyot is decided by</text>
<text class="t small" x="44" y="422">whether coral can grow upward fast enough - which depends on the water being warm enough. Darwin worked</text>
<text class="t small" x="44" y="436">the whole sequence out in 1842 from the shapes alone, before anyone knew the sea floor moved at all.</text>
<text class="t small" x="44" y="450"></text>
<text class="t small" x="44" y="464">FOR THE MODEL: this is the same physics as the seamount population in seafloor.py. Seeding seamounts along</text>
<text class="t small" x="44" y="478">plume tracks and letting them subside with crustal age predicts flat-topped guyots at depth on old chains and</text>
<text class="t small" x="44" y="492">sharp cones and islands on young ones - for free, from a mechanism rather than from a texture.</text>
</svg>