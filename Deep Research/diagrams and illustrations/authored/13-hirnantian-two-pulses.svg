<text class="t small" x="150" y="498">End-Ordovician: ~85% species lost, the second-largest extinction of the Phanerozoic. Two pulses: glacial onset then deglaciation. Driven by the Hirnantian ice sheet.</text>
<text class="t small" x="150" y="513">Glaciation 445.2-443.1 Ma (good confidence). South Pole over North Africa. Drove the End-Ordovician extinction.</text>
<text class="t small" x="150" y="528">Anoxia 445.2-443.1 Ma (moderate confidence). Repetitive, oxic-interspersed. The curves are schematic in AMPLITUDE — the dates and the order of events are from the catalogues, the shapes are drawn to show the sequence.</text>
</svg>