<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470">
<style>
  .bg{fill:#11161c}
  .panel{fill:#161d25;stroke:#2a3644;stroke-width:1}
  .t{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;fill:#d8e2ec}
  .title{font-size:19px;font-weight:600;letter-spacing:.2px}
  .sub{font-size:11.5px;fill:#8fa3b8}
  .lab{font-size:11px}
  .small{font-size:9.5px;fill:#9fb2c6}
  .tick{stroke:#3a4756;stroke-width:1}
  .axis{stroke:#5b6b7d;stroke-width:1.2}
  .grid{stroke:#232d39;stroke-width:1}
  .lead{stroke:#4d5f73;stroke-width:1;stroke-dasharray:2 2}
</style>
<rect class="bg" x="0" y="0" width="1180" height="470"/>
<text class="t title" x="28" y="34">Why deep-time labels land in the wrong place</text>
<text class="t sub" x="28" y="53">Palaeomagnetism constrains latitude and rotation, never longitude - so every reconstruction picks its own frame</text>
<circle cx="300" cy="260" r="150" fill="#182028" stroke="#33414f"/>
<line class="grid" x1="188.2" y1="360.0" x2="411.8" y2="360.0"/>
<line class="grid" x1="158.6" y1="310.0" x2="441.4" y2="310.0"/>
<line class="grid" x1="150.0" y1="260.0" x2="450.0" y2="260.0"/>
<line class="grid" x1="158.6" y1="210.0" x2="441.4" y2="210.0"/>
<line class="grid" x1="188.2" y1="160.0" x2="411.8" y2="160.0"/>
<line class="axis" x1="300" y1="94" x2="300" y2="426"/>
<text class="t small" x="300" y="86" text-anchor="middle">spin axis</text>
<ellipse cx="204.0" cy="210.0" rx="30" ry="18" fill="#c9a227" opacity="0.72"/>
<text class="t small" x="204.0" y="214.0" text-anchor="middle" fill="#0d1218">position A</text>
<ellipse cx="300.0" cy="210.0" rx="30" ry="18" fill="#8fb4d0" opacity="0.72"/>
<text class="t small" x="300.0" y="214.0" text-anchor="middle" fill="#0d1218">position B</text>
<ellipse cx="396.0" cy="210.0" rx="30" ry="18" fill="#d0866f" opacity="0.72"/>
<text class="t small" x="396.0" y="214.0" text-anchor="middle" fill="#0d1218">position C</text>
<text class="t small" x="300" y="450" text-anchor="middle">Identical palaeomagnetic pole. Identical inclination. Identical declination.</text>
<text class="t small" x="300" y="466" text-anchor="middle" fill="#e07650">Nothing in the data distinguishes A, B and C.</text>
<rect class="panel" x="640" y="96" width="506" height="300" rx="6"/>
<text class="t small" x="658" y="124" fill="#c9a227">Terrain: Scotese &amp; Wright PaleoDEMs, PALEOMAP frame</text>
<text class="t small" x="658" y="141" fill="#8fb4d0">Tracks: Merdith et al. 2021, its own frame</text>
<text class="t small" x="658" y="175">Measured longitude gap between the two frames:</text>
<text class="t small" x="658" y="192">    ~9 deg at 90 Ma      ~21 deg at 150 Ma      ~40 deg in the Ordovician</text>
<text class="t small" x="658" y="226" fill="#e07650">Symptom: the Western Interior Seaway label sat over the Appalachians.</text>
<text class="t small" x="658" y="260">frame_offset.py corrects it as a RIGID global shift.</text>
<text class="t small" x="658" y="277">Craters on plausible terrain   80% -&gt; 90%</text>
<text class="t small" x="658" y="294">Label anchors on right medium  69% -&gt; 71%</text>
<text class="t small" x="658" y="328" fill="#e07650">But the real difference is REGIONAL, not rigid: each model pins</text>
<text class="t small" x="658" y="345" fill="#e07650">longitude by a different argument, and the arguments differ</text>
<text class="t small" x="658" y="362" fill="#e07650">per continent. So a global shift moves Chicxulub off the shelf</text>
<text class="t small" x="658" y="379" fill="#e07650">while it fixes the seaway. 27 labels remain on the wrong medium</text>
<text class="t small" x="658" y="396" fill="#e07650">for more than a third of their span.</text>
</svg>