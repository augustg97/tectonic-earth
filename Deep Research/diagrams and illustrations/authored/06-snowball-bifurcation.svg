<text class="t small" x="208.0" y="126" fill="#e07650">deglaciation threshold</text>
<rect class="panel" x="832" y="108" width="314" height="300" rx="6"/>
<text class="t small" x="848" y="132">1-D diffusive energy balance model,</text>
<text class="t small" x="848" y="147">solar luminosity at 700 Ma (Gough 1981):</text>
<text class="t small" x="848" y="162">8% fainter than today.</text>
<text class="t small" x="848" y="177"></text>
<text class="t small" x="848" y="192">Blue  = hard snowball (ice fraction &gt; 0.95)</text>
<text class="t small" x="848" y="207">Gold  = partial ice cover</text>
<text class="t small" x="848" y="222">Green = ice free</text>
<text class="t small" x="848" y="237"></text>
<text class="t small" x="848" y="252">The point of the figure is the DISCONTINUITY.</text>
<text class="t small" x="848" y="267">Once ice reaches the subtropics the albedo</text>
<text class="t small" x="848" y="282">feedback runs away, and escaping needs a CO2</text>
<text class="t small" x="848" y="297">level orders of magnitude above the one that</text>
<text class="t small" x="848" y="312">let the planet freeze. That hysteresis is why</text>
<text class="t small" x="848" y="327">the Cryogenian terminations required a spike</text>
<text class="t small" x="848" y="342">of order 10^5 ppm and produced cap carbonates.</text>
<text class="t small" x="848" y="357"></text>
<text class="t small" x="848" y="372">Caveat, stated in the module: the logarithmic</text>
<text class="t small" x="848" y="387">CO2 forcing law is not valid at 10^5 ppm, so</text>
<text class="t small" x="848" y="402">the absolute threshold here is too high. The</text>
<text class="t small" x="848" y="417">hysteresis is robust; the number is not.</text>
</svg>