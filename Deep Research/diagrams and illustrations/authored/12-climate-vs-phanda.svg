<text class="t small" x="150" y="542">Both curves are read straight out of build/climate.py, so this figure cannot drift from the table it is assessing.</text>
<text class="t small" x="150" y="556">Bands are the PhanDA five-state scheme (Judd et al. 2024, Science 385, eadk3705). Dashed red lines are the Big Five.</text>
<text class="t small" x="150" y="570"></text>
<text class="t small" x="150" y="584">THE TWO FINDINGS: our warm peak sits in the right PLACE — the Turonian — but 6 °C too low, so the app never enters</text>
<text class="t small" x="150" y="598">the hothouse state at all, while PhanDA finds Earth spent more of the Phanerozoic warm than cold. And 66→56 Ma,</text>
<text class="t small" x="150" y="612">CO₂ doubles 810→1600 ppm while GMST moves only +1.5 °C, in the one interval containing both the PETM and the EECO.</text>
